<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Card</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <div id="container">

        <h1>Student Card Generator</h1>

        <form id="form">

            <label for="studentName">
                Student Name:
                <br>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >
            </label>

            <br>

            <label for="studentId">
                Student ID:
                <br>
                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your student ID"
                    required
                >
            </label>

            <br>

            <label for="branch">
                Branch:
                <br>
                <input
                    type="text"
                    id="branch"
                    placeholder="Enter your branch"  
                    required
                >
            </label>

            <br>

            <button type="submit" id="submitBtn">
                Generate Card
            </button>

        </form>

    </div>

</body>
</html>
